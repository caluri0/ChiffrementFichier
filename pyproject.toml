[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiffrement-fichier"
version = "0.1.0"
description = "Local file encryption tool (AES-GCM, RSA hybrid) - portfolio learning project"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0,<44.0.0",
]
optional-dependencies = {
    "docs" = ["fpdf2>=2.7.0,<3.0.0"],
    "dev" = [
        "pytest>=8.0.0",
        "pytest-cov>=4.1.0",
        "ruff>=0.5.0",
        "mypy>=1.10.0",
    ],
}

[project.scripts]
encrypt-file = "main:main"

[project.urls]
Repository = "https://github.com/<your-username>/ChiffrementFichier"
Issues = "https://github.com/<your-username>/ChiffrementFichier/issues"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH"]
ignore = ["ARG001", "ARG002"]
fixable = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
